<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Здоровья и Инсулина</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transition: all 0.25s ease;
        }

        .glass-input:focus {
            background: rgba(15, 23, 42, 0.85);
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
            outline: none;
        }

        .glass-input::placeholder {
            color: #94a3b8;
        }

        .top-clock-container {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }

        .glow-effect {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
        }
    </style>
</head>
<body class="pb-12 pt-28 px-4 flex flex-col items-center">

    <!-- Top Center Live Glassmorphism Clock -->
    <div class="top-clock-container w-11/12 max-w-sm">
        <div class="glass-panel glow-effect rounded-2xl py-3 px-6 text-center border border-sky-500/20">
            <div class="text-xs font-semibold tracking-widest text-sky-400 uppercase mb-0.5" id="clock-date">--.--------.----</div>
            <div class="text-3xl sm:text-4xl font-extrabold tracking-wider text-white drop-shadow-md font-mono" id="digital-clock">00:00:00</div>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="w-full max-w-lg space-y-6">
        
        <!-- Header Title -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                <i class="fa-solid font-bold heart-pulse text-sky-400"></i> Дневник  
            </h1>
            <p class="text-sm text-slate-400">чуваки меня так вставило</p>
        </div>

        <!-- Notification Toast Box -->
        <div id="toast" class="hidden glass-panel border-l-4 border-emerald-500 p-4 rounded-xl text-emerald-300 text-sm flex items-center gap-3 transition-all">
            <i class="fa-solid fa-circle-check text-lg"></i>
            <span id="toast-message">Запись успешно сохранена!</span>
        </div>

        <!-- Form Card Container -->
        <div class="glass-panel rounded-3xl p-6 sm:p-8 space-y-5">
            <form id="health-form" onsubmit="handleSave(event)" class="space-y-4">
                
                <!-- 1. Sugar Level Input -->
                <div class="space-y-1.5">
                    <label for="sugar" class="block text-sm font-medium text-slate-200 flex items-center justify-between">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-droplet text-rose-400 w-4"></i> Сахар в крови
                        </span>
                        <span class="text-xs text-slate-400">ммоль/л</span>
                    </label>
                    <input type="number" step="0.1" id="sugar" placeholder="Например: 5.6" required
                        class="glass-input w-full px-4 py-3 rounded-xl text-base focus:ring-0">
                </div>

                <!-- 2. Insulin Dose Input -->
                <div class="space-y-1.5">
                    <label for="insulin" class="block text-sm font-medium text-slate-200 flex items-center justify-between">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-syringe text-sky-400 w-4"></i> Доза инсулина
                        </span>
                        <span class="text-xs text-slate-400">ЕД (Единиц)</span>
                    </label>
                    <input type="number" step="0.5" id="insulin" placeholder="Например: 4" required
                        class="glass-input w-full px-4 py-3 rounded-xl text-base focus:ring-0">
                </div>

                <!-- 3. Food / Bread Units Input -->
                <div class="space-y-1.5">
                    <label for="food" class="block text-sm font-medium text-slate-200 flex items-center justify-between">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-utensils text-amber-400 w-4"></i> Прием пищи / ХЕ
                        </span>
                        <span class="text-xs text-slate-400">Хлебные Единицы</span>
                    </label>
                    <input type="number" step="0.1" id="food" placeholder="Например: 3.5 ХЕ"
                        class="glass-input w-full px-4 py-3 rounded-xl text-base focus:ring-0">
                </div>

                <!-- 4. Physical Activity Input -->
                <div class="space-y-1.5">
                    <label for="activity" class="block text-sm font-medium text-slate-200 flex items-center justify-between">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-weight text-emerald-400 w-4"></i> Физическая активность
                        </span>
                    </label>
                    <input type="text" id="activity" placeholder="Например: снятие наклеек с бананов"
                        class="glass-input w-full px-4 py-3 rounded-xl text-base focus:ring-0">
                </div>

                <!-- 5. Location Input -->
                <div class="space-y-1.5">
                    <label for="location" class="block text-sm font-medium text-slate-200 flex items-center justify-between">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-school text-indigo-400 w-4"></i> Местоположение
                        </span>
                        <span class="text-xs text-slate-400">где мы? в лондоне</span>
                    </label>
                    <input type="text" id="location" placeholder="Например: школа, дом, вегас"
                        class="glass-input w-full px-4 py-3 rounded-xl text-base focus:ring-0">
                </div>

                <!-- 6. Notes Input -->
                <div class="space-y-1.5">
                    <label for="notes" class="block text-sm font-medium text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-purple-400 w-4"></i> Заметки / Самочувствие
                    </label>
                    <textarea id="notes" rows="2" placeholder="кто раздражает"
                        class="glass-input w-full px-4 py-3 rounded-xl text-base focus:ring-0 resize-none"></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="pt-3 grid grid-cols-2 gap-3">
                    <button type="button" onclick="resetForm()"
                        class="w-full py-3 px-4 rounded-xl font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center justify-center gap-2 active:scale-95">
                        <i class="fa-solid fa-rotate-left"></i> Очистить
                    </button>
                    <button type="submit"
                        class="w-full py-3 px-4 rounded-xl font-semibold bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white shadow-lg shadow-sky-500/25 transition flex items-center justify-center gap-2 active:scale-95">
                        <i class="fa-solid fa-floppy-disk"></i> Сохранить
                    </button>
                </div>

            </form>
        </div>

        <!-- History Records Section -->
        <div class="glass-panel rounded-3xl p-6 sm:p-8 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-sky-400"></i> История записей
                </h2>
                <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-rose-400 transition">
                    Очистить историю
                </button>
            </div>

            <div id="history-list" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                <p id="empty-history" class="text-sm text-slate-400 text-center py-4">
                    Сохраненные записи пока отсутствуют
                </p>
            </div>
        </div>

    </main>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_HH1UBE_8gMa0Pi05q8faNNackmsSN_vqUf7ehvbAeoG2HlS2LAhRwEIyTrhY3-kQFw/exec';

        // --- 1. CLOCK ---
        function updateClock() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            const clockEl = document.getElementById('digital-clock');
            if (clockEl) clockEl.textContent = `${hours}:${minutes}:${seconds}`;

            const dateEl = document.getElementById('clock-date');
            if (dateEl) {
                const options = { weekday: 'short', day: 'numeric', month: 'short' };
                dateEl.textContent = now.toLocaleDateString('ru-RU', options).toUpperCase();
            }
        }

        updateClock();
        setInterval(updateClock, 1000);

        // --- 2. LOCAL STORAGE ---
        let logs = JSON.parse(localStorage.getItem('health_logs') || '[]');

        function saveLogsToStorage() {
            localStorage.setItem('health_logs', JSON.stringify(logs));
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            if (!historyList) return;
            
            if (logs.length === 0) {
                historyList.innerHTML = `<p id="empty-history" class="text-sm text-slate-400 text-center py-4">Сохраненные записи пока отсутствуют</p>`;
                return;
            }

            historyList.innerHTML = logs.map((item, index) => `
                <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3.5 space-y-2 text-sm">
                    <div class="flex items-center justify-between text-xs text-sky-400 border-b border-slate-800/80 pb-2">
                        <span class="font-semibold"><i class="fa-regular fa-clock mr-1"></i>${item.timestring}</span>
                        <button onclick="deleteLog(${index})" class="text-slate-500 hover:text-rose-400 transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="text-slate-300"><span class="text-slate-400">Сахар:</span> <b class="text-rose-300 font-semibold">${item.sugar} ммоль/л</b></div>
                        <div class="text-slate-300"><span class="text-slate-400">Инсулин:</span> <b class="text-sky-300 font-semibold">${item.insulin} ЕД</b></div>
                        ${item.food ? `<div class="text-slate-300"><span class="text-slate-400">ХЕ:</span> <b>${item.food}</b></div>` : ''}
                        ${item.activity ? `<div class="text-slate-300"><span class="text-slate-400">Активность:</span> <b>${item.activity}</b></div>` : ''}
                        ${item.location ? `<div class="text-slate-300"><span class="text-slate-400">Локация:</span> <b>${item.location}</b></div>` : ''}
                    </div>
                    ${item.notes ? `<div class="text-xs text-slate-400 italic bg-slate-800/40 p-2 rounded-lg mt-1 border border-slate-800">${item.notes}</div>` : ''}
                </div>
            `).join('');
        }

        // --- 3. SAVE HANDLER ---
        async function handleSave(event) {
            event.preventDefault();

            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalBtnContent = submitBtn.innerHTML;
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Сохранение...`;

            const sugar = document.getElementById('sugar').value;
            const insulin = document.getElementById('insulin').value;
            const food = document.getElementById('food').value;
            const activity = document.getElementById('activity').value;
            const location = document.getElementById('location').value;
            const notes = document.getElementById('notes').value;

            const now = new Date();
            const timestring = `${now.toLocaleDateString('ru-RU')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newEntry = {
                timestring,
                sugar,
                insulin,
                food,
                activity,
                location,
                notes
            };

            try {
                if (GOOGLE_SCRIPT_URL) {
                    // Кодирование данных для надежной отправки формы
                    const params = new URLSearchParams();
                    for (const key in newEntry) {
                        params.append(key, newEntry[key]);
                    }

                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: params
                    });
                }

                // Сохранение в LocalStorage
                logs.unshift(newEntry);
                saveLogsToStorage();
                renderHistory();

                resetForm();
                showToast('Данные успешно сохранены!');
            } catch (error) {
                console.error('Ошибка при отправке:', error);
                showToast('Ошибка отправки в таблицу');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
            }
        }

        function resetForm() {
            document.getElementById('health-form').reset();
        }

        function deleteLog(index) {
            logs.splice(index, 1);
            saveLogsToStorage();
            renderHistory();
        }

        function clearHistory() {
            if (logs.length === 0) return;
            if (confirm('Удалить всю локальную историю?')) {
                logs = [];
                saveLogsToStorage();
                renderHistory();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        renderHistory();
    </script>
</body>
</html>
